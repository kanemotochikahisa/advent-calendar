name: Auto Update Calendar
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install google-auth google-api-python-client requests
      - name: Run Fetch Script
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cat << 'EOF' > fetch_data.py
          import json, os, re
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
              info = json.loads(os.environ.get('GCP_KEY'))
              creds = service_account.Credentials.from_service_account_info(info)
              service = build('sheets', 'v4', credentials=creds)
              spreadsheet_id = '1DVbCRhxizfF4FtQ0z093XfsCwXagt5qCsZwtdkramg4'

              sheet_metadata = service.spreadsheets().get(spreadsheetId=spreadsheet_id).execute()
              target_sheet_name = sheet_metadata['sheets'][0]['properties']['title']

              result = service.spreadsheets().values().get(
                  spreadsheetId=spreadsheet_id,
                  range=f'{target_sheet_name}!M:M'
              ).execute()

              values = result.get('values', [])
              
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write('window.calendarData = [\n') # window. を付けて確実に認識させる
                  for row in values:
                      if row:
                          line = str(row[0])
                          match = re.search(r'\{.*\}', line)
                          if match:
                              # 行の最後にコンマを付けて書き出す
                              f.write(match.group(0) + ',\n')
                  f.write('];')
              print(f'Successfully updated data.js with {len(values)} rows')

          except Exception as e:
              print(f'Error: {e}')
              exit(1)
          EOF
          python3 fetch_data.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "update data with commas" && git push)
