name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # JSON_START と JSON_END に挟まれた { ... } 部分だけを「一行ずつ」丁寧に取り出します
          grep -o "JSON_START{.*}JSON_END" data.csv | sed 's/JSON_START//g; s/JSON_END//g' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "抽出ロジックを最強版に更新" || exit 0
          git push
