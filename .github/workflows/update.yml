name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # START_DATA と END_DATA に挟まれた { ... } 部分だけを抜き出し、CSVの余計な引用符を掃除します
          grep -o "START_DATA{.*}END_DATA" data.csv | sed 's/START_DATA//g; s/END_DATA//g; s/""/"/g' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "データ同期：合言葉抽出方式に完全移行" || exit 0
          git push
