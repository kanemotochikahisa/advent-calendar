name: Auto Update Calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client requests

      - name: Run Fetch Script
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cat << 'EOF' > fetch_data.py
          import json, os, re
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          try:
              info = json.loads(os.environ.get('GCP_KEY'))
              creds = service_account.Credentials.from_service_account_info(info)
              service = build('sheets', 'v4', credentials=creds)
              spreadsheet_id = '1DVbCRhxizfF4FtQ0z093XfsCwXagt5qCsZwtdkramg4'
              sheet_metadata = service.spreadsheets().get(spreadsheetId=spreadsheet_id).execute()
              target_sheet_name = sheet_metadata['sheets'][0]['properties']['title']
              result = service.spreadsheets().values().get(
                  spreadsheetId=spreadsheet_id,
                  range=f'{target_sheet_name}!M:M'
              ).execute()
              values = result.get('values', [])
              
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write('window.calendarData = [\n')
                  for row in values:
                      if row:
                          line = str(row[0])
                          match = re.search(r'\{.*\}', line)
                          if match:
                              f.write(match.group(0) + ',\n')
                  f.write('];')
              print(f'Success: Created data.js with {len(values)} entries')
          except Exception as e:
              print(f'Error: {e}')
              exit(1)
          EOF
          python3 fetch_data.py

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【重要】-f をつけて強制的に data.js を認識させる
          git add -f data.js
          
          # 変更の有無に関わらず強制的にコミットを作る
          git commit --allow-empty -m "chore: forced data update"
          
          # メインブランチへプッシュ
          git push origin main
