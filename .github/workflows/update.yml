name: Auto Update Calendar
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # 【重要】ダウンロードした中身から、HTMLタグを無視して ### で囲まれたJSONだけを抽出します
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" | grep -o "###{.*}###" | sed 's/###//g' | sed 's/""/"/g' >> data.js
          echo "];" >> data.js
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add data.js
          # 変更がある場合のみ保存（何もない時はエラーにしない）
          git diff --quiet && git diff --staged --quiet || (git commit -m "update data" && git push)
