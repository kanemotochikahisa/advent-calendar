name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          # 公開用スプシCSV URL
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # スプシから届くデータの中から、正しいJSON形式の { ... } だけを抽出
          # 二重の引用符（""）を単一（"）に直し、JSON_STARTなどのゴミも削除します
          grep -o "{.*}" data.csv | sed 's/""/"/g' | grep -v "date" >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "データ抽出ロジックの最終調整" || exit 0
          git push
