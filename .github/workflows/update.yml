name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          # 坂上さんの公開用スプシCSV URL
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # Googleのログイン画面コード（HTML/CSS）を完全に無視し、
          # START_JSON{ ... }END_JSON の中身だけを1記事1行で抽出します
          grep -o "START_JSON{.*}END_JSON" data.csv | sed 's/START_JSON//g; s/END_JSON//g; s/""/"/g' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "元ファイルからの自動同期（合言葉抽出方式）" || exit 0
          git push
