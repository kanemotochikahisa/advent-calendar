name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *' # 1時間に1回自動更新
  workflow_dispatch: # 手動更新ボタン

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          # 坂上さんの公開用スプシCSV URL
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # CSVの中から { で始まる「正しいデータ行」だけを抜き出し、余計な " を整理します
          grep "{" data.csv | sed 's/^"//;s/"$//;s/""/"/g' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "スプシから最新データを取得（ゴミ除去版）" || exit 0
          git push
