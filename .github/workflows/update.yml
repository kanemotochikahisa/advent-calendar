name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *' # 1時間に1回、自動でスプシを見に行きます
  workflow_dispatch: # ボタンを押して今すぐ更新もできます

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download Data
        run: |
          # 坂上さんのCSV URLからデータをダウンロード
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv
      - name: Create Data JS
        run: |
          # CSVから余計な引用符を整理して data.js を作成
          echo "const calendarData = [" > data.js
          tail -n +2 data.csv | sed 's/^"//;s/"$//;s/""/"/g' >> data.js
          echo "];" >> data.js
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "スプシから最新データを取得" || exit 0
          git push
