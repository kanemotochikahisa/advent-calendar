name: Auto Update Calendar
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download Google Sheets Data
        uses: jasonmccreary/google-sheet-download@v1
        with:
          # あなたのスプシのID
          spreadsheet_id: '1DVbCRhxizfF4FtQ0z093XfsCwXagt5qCsZwtdkramg4'
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          output: data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # スプシのA列にあるJSON行を抽出して整形
          grep -o "{.*}" data.csv | sed 's/""/"/g' | sed 's/$/,/' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add data.js
          git commit -m "update data" || exit 0
          git push
