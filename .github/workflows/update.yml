name: Auto Update Calendar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Data
        run: |
          # スプシCSV URLをダウンロード
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # "JSON_START" という文字が含まれる行だけを抽出し、
          # 余計な "" を " に直し、JSON_START / JSON_END という目印を消します
          grep "JSON_START" data.csv | sed 's/""/"/g' | sed 's/JSON_START//g; s/JSON_END//g' | grep -v '"date":"date"' >> data.js
          echo "];" >> data.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Googleのゴミを除去し本番データのみを抽出" || exit 0
          git push
