name: Auto Update Calendar
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create Data JS
        run: |
          echo "const calendarData = [" > data.js
          # スプシをダウンロードして、ゴミを無視してそのまま貼り付ける
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pub?gid=0&single=true&output=csv" | grep "{" | sed 's/""/"/g' >> data.js
          echo "];" >> data.js
      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add data.js
          git commit -m "update" || exit 0
          git push
