name: Sync Jira Data
on:
  schedule:
    - cron: '0 * * * *' # 1時間に1回自動更新
  workflow_dispatch:   # ボタンで手動更新も可能

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Data from GAS
        run: |
          # 認証を通すために、GASのURLを叩いて結果をdata.jsonに保存する
          # 本来は認証が必要ですが、GAS側で「TOKIUM内全員」にしていれば、
          # このステップで工夫してデータを取得します。
          curl -L "${{ secrets.GAS_URL }}" -o data.json
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Update calendar data" || exit 0
          git push
