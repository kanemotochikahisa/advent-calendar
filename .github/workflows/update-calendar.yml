name: Auto Update Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install google-auth google-api-python-client requests beautifulsoup4

      - name: Run Fetch Script
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cat << 'EOF' > fetch_data.py
          import json
          import os
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          def get_ogp(url):

              try:
                  r = requests.get(url,timeout=5)

                  soup = BeautifulSoup(r.text,"html.parser")

                  tag = soup.find("meta",property="og:image")

                  if tag:
                      return tag["content"]

              except:
                  pass

              return ""

          info = json.loads(os.environ["GCP_KEY"])

          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )

          service = build("sheets","v4",credentials=creds)

          SPREADSHEET_ID = "1DVbCRhxizfF4FtQ0z093XfsCwXagt5qCsZwtdkramg4"

          result = service.spreadsheets().values().get(
              spreadsheetId=SPREADSHEET_ID,
              range="calendar_db!A:G"
          ).execute()

          rows = result.get("values",[])[1:]

          today = datetime.today()

          data=[]

          for r in rows:

              if len(r)<7:
                  continue

              date_str=r[0]

              try:
                  date=datetime.strptime(date_str,"%Y/%m/%d")
              except:
                  continue

              if date>today:
                  continue

              url=r[6]

              image=""

              if url:
                  image=get_ogp(url)

              data.append({

                  "date":r[0],
                  "title":r[1],
                  "author":r[2],
                  "type":r[3],
                  "status":r[4],
                  "key":r[5],
                  "url":url,
                  "image":image

              })

          os.makedirs("data",exist_ok=True)

          with open("data/calendar.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,indent=2)

          print("calendar.json updated")

          EOF

          python3 fetch_data.py

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add data/calendar.json
          git commit --allow-empty -m "update calendar"
          git push origin HEAD
