<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>Tech Blog Calendar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Tech Blog Calendar</h1>

<div class="calendar-nav">
<button onclick="prevMonth()">◀</button>
<div id="monthLabel"></div>
<button onclick="nextMonth()">▶</button>
</div>

<div class="week-header">
<div>SUN</div>
<div>MON</div>
<div>TUE</div>
<div>WED</div>
<div>THU</div>
<div>FRI</div>
<div>SAT</div>
</div>

<div id="calendar"></div>

</div>

<script src="script.js"></script>

</body>
</html>
