<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Advent Calendar 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📅 TOKIUM Advent Calendar 2026</h1>
        <p>タイトルと製作者を記録するアドベントカレンダー</p>
    </header>

    <main>
        <div id="loading" class="message">データを読み込み中...</div>
        <div class="calendar-grid" id="calendar"></div>
    </main>

    <script>
        const GAS_URL = 'https://script.google.com/a/macros/tokium.jp/s/AKfycbxA3dZch-F0jJT0CP45UAGAkf4bHiPmChxYqHl7u18eTyiIB-v1t2dYDe0_Vr9-mnocwA/exec';

        async function fetchCalendar() {
            try {
                // キャッシュを回避するためにURLにタイムスタンプを付与
                const response = await fetch(`${GAS_URL}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                console.log("取得データ:", data); // ブラウザのF12キーで見れるログ

                const container = document.getElementById('calendar');
                document.getElementById('loading').style.display = 'none';

                if (!data || data.length === 0) {
                    document.getElementById('loading').innerHTML = '表示できる記事がまだありません。';
                    return;
                }

                // 日付順（古い順）にソート
                data.sort((a, b) => {
                    const dateA = a.date ? new Date(a.date) : new Date(8640000000000000);
                    const dateB = b.date ? new Date(b.date) : new Date(8640000000000000);
                    return dateA - dateB;
                });

                data.forEach(item => {
                    // 日付の整形 (GMT形式から M/D 形式へ)
                    let displayDate = "日付未定";
                    if (item.date) {
                        const d = new Date(item.date);
                        if (!isNaN(d.getTime())) {
                            displayDate = `${d.getMonth() + 1}/${d.getDate()}`;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-date">${displayDate}</div>
                        <div class="card-author">👤 ${item.name || 'Anonymous'}</div>
                        <h2 class="card-title">${item.title || '（タイトル未設定）'}</h2>
                        ${item.url ? 
                            `<a href="${item.url}" target="_blank" class="card-link">記事を読む</a>` : 
                            '<span class="pending">執筆中...</span>'}
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("エラー詳細:", error);
                document.getElementById('loading').innerHTML = '❌ データの取得に失敗しました。<br>TOKIUMアカウントでGoogleログイン後に再読み込みしてください。';
            }
        }

        fetchCalendar();
    </script>
</body>
</html>
