<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOKIUM Tech Blog Calendar</title>

<style>
:root {
    --tokium-blue: #004bb1;
    --tokium-light: #e6edf7;
    --border-color: #cbd5e0;
}

body{
    font-family:"Hiragino Sans","Meiryo",sans-serif;
    background:#f1f5f9;
    margin:0;
    padding:10px;
}

.header{
    text-align:center;
}

.header h1{
    color:var(--tokium-blue);
}

.nav-controls{
    display:flex;
    justify-content:center;
    gap:20px;
}

.nav-btn{
    background:var(--tokium-blue);
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
}

.calendar-container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:10px;
}

.weekday-header{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    background:var(--tokium-light);
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.day-slot{
    border:1px solid var(--border-color);
    min-height:80px;
    padding:4px;
}

.day-number{
    font-size:12px;
    color:#999;
}

.card{
    display:block;
    text-decoration:none;
    font-size:12px;
    margin-top:4px;
}

.card-title{
    font-weight:bold;
}

.card-author{
    font-size:11px;
}
</style>

</head>

<body>

<div class="header">
<h1>TOKIUM Tech Blog</h1>

<div class="nav-controls">
<button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
<div id="month-display"></div>
<button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
</div>
</div>

<div class="calendar-container">

<div class="weekday-header">
<div>SUN</div>
<div>MON</div>
<div>TUE</div>
<div>WED</div>
<div>THU</div>
<div>FRI</div>
<div>SAT</div>
</div>

<div id="calendar" class="calendar-grid"></div>

</div>

<script>

let currentViewDate=new Date()
let allPosts=[]

async function loadData(){

const res=await fetch("./data.json?"+Date.now())
allPosts=await res.json()

renderCalendar()

}

function changeMonth(diff){

currentViewDate.setMonth(currentViewDate.getMonth()+diff)
renderCalendar()

}

function renderCalendar(){

const calendar=document.getElementById("calendar")
calendar.innerHTML=""

const monthDisplay=document.getElementById("month-display")

const year=currentViewDate.getFullYear()
const month=currentViewDate.getMonth()

monthDisplay.textContent=year+" / "+(month+1)

const firstDay=new Date(year,month,1).getDay()
const lastDate=new Date(year,month+1,0).getDate()

for(let i=0;i<firstDay;i++){

const blank=document.createElement("div")
blank.className="day-slot"

calendar.appendChild(blank)

}

for(let day=1;day<=lastDate;day++){

const slot=document.createElement("div")
slot.className="day-slot"

slot.innerHTML='<div class="day-number">'+day+'</div>'

const dateStr=year+"/"+String(month+1).padStart(2,"0")+"/"+String(day).padStart(2,"0")

const post=allPosts.find(p=>p.date===dateStr)

if(post){

const card=document.createElement("a")

card.className="card"

if(post.url){
card.href=post.url
card.target="_blank"
}

card.innerHTML=
'<div class="card-title">'+post.title+'</div>'+
'<div class="card-author">'+post.name+'</div>'

slot.appendChild(card)

}

calendar.appendChild(slot)

}

}

loadData()

</script>

</body>
</html>
