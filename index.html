<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOKIUM Advent Calendar 2025</title>
    <style>
        :root { --main-color: #004bb1; --bg-color: #f4f7f9; }
        body { font-family: sans-serif; background-color: var(--bg-color); padding: 40px 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: flex; flex-direction: column; min-height: 120px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); transition: 0.2s; }
        .date-circle { width: 35px; height: 35px; background: var(--main-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 10px; }
        .title { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; flex-grow: 1; }
        .author { font-size: 0.8rem; color: #666; text-align: right; }
    </style>
</head>
<body>

<h1 style="text-align:center; color:#004bb1;">TOKIUM Advent Calendar 2025</h1>
<div id="calendar" class="calendar-grid"></div>

<script>
    // ★ここをスプシからコピーしたデータで書き換えるだけ！
    const data = [
        { "date": "2025/12/01", "name": "芦田 拓人", "title": "Jira自動化のコツ", "url": "https://note.com/..." },
        { "date": "2025/12/02", "name": "立花 登斗", "title": "GitHub Pages導入記", "url": "https://tech.tokium.jp/..." }
    ];

    function render() {
        const container = document.getElementById('calendar');
        data.sort((a, b) => new Date(a.date) - new Date(b.date));
        data.forEach(item => {
            const day = new Date(item.date).getDate();
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.url;
            card.target = '_blank';
            card.innerHTML = `<div class="date-circle">${day}</div><div class="title">${item.title}</div><div class="author">${item.name}</div>`;
            container.appendChild(card);
        });
    }
    render();
</script>
</body>
</html>
