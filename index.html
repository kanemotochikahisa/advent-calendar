<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Tech Blog Calendar 2025</title>
    <script src="./data.js"></script>
    <style>
        :root {
            --tokium-blue: #004bb1;
            --bg-color: #f4f7f9;
            --text-color: #333;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: var(--tokium-blue);
            margin-bottom: 40px;
            font-size: 1.8rem;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            min-height: 140px;
            transition: all 0.3s ease;
            border-left: 6px solid var(--tokium-blue);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }
        .date-circle {
            width: 40px;
            height: 40px;
            background: var(--tokium-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .title {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 12px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .author {
            font-size: 0.85rem;
            color: #666;
            text-align: right;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        /* データがない時のメッセージ */
        #empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>

<h1>TOKIUM Tech Blog Calendar 2025</h1>
<div id="calendar" class="calendar-grid">
    <div id="empty-message">データを読み込み中...</div>
</div>

<script>
    function render() {
        const container = document.getElementById('calendar');
        
        // calendarData が data.js から正しく読み込まれているかチェック
        if (typeof calendarData === 'undefined' || calendarData.length === 0) {
            container.innerHTML = '<div id="empty-message">記事データが見つかりませんでした。GitHub Actionsを実行してください。</div>';
            return;
        }

        // メッセージを消去
        container.innerHTML = '';

        // 日付順に並び替え
        const sortedData = [...calendarData].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedData.forEach(item => {
            // 日付が空の場合はスキップ
            if (!item.date) return;

            const day = new Date(item.date).getDate();
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.url || '#';
            card.target = '_blank';

            card.innerHTML = `
                <div class="date-circle">${day}</div>
                <div class="title">${item.title || '無題の記事'}</div>
                <div class="author">${item.name || '不明な執筆者'}</div>
            `;
            container.appendChild(card);
        });
    }

    // 読み込み完了時に実行
    window.onload = render;
</script>
</body>
</html>
