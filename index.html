<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOKIUM Tech Blog Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <h1>TOKIUM Tech Blog</h1>
    <div class="nav-controls">
      <button onclick="changeMonth(-1)">◀ PREV</button>
      <div id="month-label"></div>
      <button onclick="changeMonth(1)">NEXT ▶</button>
    </div>
  </div>

  <div class="calendar-container">
    <div class="weekday">
      <div>SUN</div><div>MON</div><div>TUE</div>
      <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>
    <div id="calendar" class="calendar"></div>
  </div>

<script>
/** ★★★★★ ここに Apps Script の WebアプリURLを入れる ★★★★★ */
const API_URL = "https://script.google.com/macros/s/【あなたのURL】/exec";

let posts = [];
let current = new Date();

async function loadData() {
  const res = await fetch(API_URL + "?t=" + Date.now());
  posts = await res.json();
  render();
}

function changeMonth(diff) {
  current.setMonth(current.getMonth() + diff);
  render();
}

function render() {
  const cal = document.getElementById("calendar");
  const label = document.getElementById("month-label");
  cal.innerHTML = "";

  const y = current.getFullYear();
  const m = current.getMonth();

  label.textContent = `${y} / ${m + 1}`;

  const firstDay = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    cal.appendChild(document.createElement("div"));
  }

  for (let d = 1; d <= lastDate; d++) {
    const cell = document.createElement("div");
    cell.className = "day";

    const dateStr = `${y}/${String(m+1).padStart(2,"0")}/${String(d).padStart(2,"0")}`;
    const post = posts.find(p => p.date === dateStr);

    cell.innerHTML = `<div class="num">${d}</div>`;

    if (post) {
      const card = document.createElement(post.url ? "a" : "div");
      card.className = "card";
      if (post.url) {
        card.href = post.url;
        card.target = "_blank";
      }

      card.innerHTML = `
        <div class="title">${post.title}</div>
        <div class="name">${post.name || ""}</div>
      `;
      cell.appendChild(card);
    }

    cal.appendChild(cell);
  }
}

loadData();
</script>
</body>
</html>
