<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tech Blog Calendar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tech Blog Calendar</h1>

<div class="controls">
<button id="prev">◀</button>
<span id="monthLabel"></span>
<button id="next">▶</button>
</div>

<div class="calendar-header">
<div>SUN</div>
<div>MON</div>
<div>TUE</div>
<div>WED</div>
<div>THU</div>
<div>FRI</div>
<div>SAT</div>
</div>

<div id="calendar"></div>

<script src="script.js"></script>

</body>
</html>
