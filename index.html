<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Tech Blog Calendar</title>
    <style>
        :root {
            --tokium-blue: #004bb1;
            --tokium-light: #e6edf7;
            --border-color: #cbd5e0;
            --text-color: #2d3748;
        }
        
        body { 
            font-family: "Hiragino Sans", "Meiryo", sans-serif; 
            background: #f1f5f9; 
            margin: 0; 
            padding: 10px; 
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh; /* 画面の高さに合わせる */
            box-sizing: border-box;
        }

        .header { text-align: center; padding: 10px 0; flex-shrink: 0; }
        .header h1 { color: var(--tokium-blue); font-size: 1.4em; margin: 0 0 10px 0; }
        
        .nav-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .nav-btn { background: var(--tokium-blue); color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .month-label { font-size: 1.1em; font-weight: bold; min-width: 120px; text-align: center; }

        /* カレンダー本体：1画面に収めるための設定 */
        .calendar-container { 
            flex-grow: 1; /* 余ったスペースを全部使う */
            max-width: 1100px; 
            margin: 0 auto; 
            width: 100%;
            display: flex;
            flex-direction: column;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            box-sizing: border-box;
            overflow: hidden; /* スクロールさせない */
        }

        /* 7列固定のヘッダー */
        .weekday-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 0.75em;
            background: var(--tokium-light);
            padding: 8px 0;
            border-radius: 4px 4px 0 0;
        }

        /* 7列固定のグリッド */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(5, 1fr); /* 基本5行で収める */
            gap: 2px;
            flex-grow: 1;
            border: 1px solid var(--border-color);
            background: var(--border-color);
        }

        .day-slot {
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 4px;
            box-sizing: border-box;
            min-height: 0; /* 中身が溢れても枠を広げない */
        }

        /* 日付の数字 */
        .day-number { 
            font-size: 0.8em; 
            font-weight: bold; 
            color: #a0aec0; 
            margin-bottom: 2px;
        }

        /* 記事カード（アドベンター風） */
        .card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            font-size: 0.7em; /* 文字を小さくして収める */
            background: #fdfdfd;
            border: 1px solid #edf2f7;
            border-radius: 3px;
            padding: 4px;
            overflow: hidden;
        }
        .card.published { border-top: 3px solid var(--tokium-blue); background: white; }
        .card.published:hover { background: var(--tokium-light); }
        .card.draft { border-top: 3px solid #cbd5e0; opacity: 0.7; }

        .card-title { 
            font-weight: bold; 
            line-height: 1.2; 
            overflow: hidden; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; /* 3行まで */
            -webkit-box-orient: vertical;
            margin-bottom: auto;
        }

        .card-author { 
            font-size: 0.9em; 
            color: var(--tokium-blue); 
            text-align: right; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* 土日の色変え */
        .weekday-header div:nth-child(1) { color: #e53e3e; } /* 日 */
        .weekday-header div:nth-child(7) { color: var(--tokium-blue); } /* 土 */

        @media (max-width: 600px) {
            .card-title { -webkit-line-clamp: 2; font-size: 0.6em; }
            .card-author { font-size: 0.6em; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>TOKIUM Tech Blog</h1>
        <div class="nav-controls">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
            <div id="month-display" class="month-label"></div>
            <button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
        </div>
    </div>

    <div class="calendar-container">
        <div class="weekday-header">
            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
        </div>
        <div id="calendar" class="calendar-grid"></div>
    </div>

    <script>
        let currentViewDate = new Date();
        let allPosts = [];

        async function loadData() {
            try {
                const response = await fetch('./data.json?v=' + new Date().getTime());
                allPosts = await response.json();
                renderCalendar();
            } catch (e) { console.error(e); }
        }

        function changeMonth(diff) {
            currentViewDate.setMonth(currentViewDate.getMonth() + diff);
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar');
            const monthDisplay = document.getElementById('month-display');
            container.innerHTML = '';

            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            monthDisplay.textContent = `${year} / ${month + 1}`;

            // 先月の余白
            for (let i = 0; i < firstDay; i++) {
                const slot = document.createElement('div');
                slot.className = 'day-slot';
                slot.style.background = '#f8fafc';
                container.appendChild(slot);
            }

            // 当月分
            for (let i = 1; i <= lastDate; i++) {
                const slot = document.createElement('div');
                slot.className = 'day-slot';
                slot.innerHTML = `<div class="day-number">${i}</div>`;

                const dateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
                const post = allPosts.find(p => p.date === dateStr);

                if (post) {
                    const isPub = post.url && post.url.startsWith('http');
                    const card = document.createElement(isPub ? 'a' : 'div');
                    card.className = `card ${isPub ? 'published' : 'draft'}`;
                    if (isPub) { card.href = post.url; card.target = '_blank'; }

                    card.innerHTML = `
                        <div class="card-title">${post.title}</div>
                        <div class="card-author">${post.name || '---'}</div>
                    `;
                    slot.appendChild(card);
                }
                container.appendChild(slot);
            }
        }
        loadData();
    </script>
</body>
</html>
