<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>TOKIUM Advent Calendar 2025</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 40px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: #333; border-left: 6px solid #004bb1; display: flex; flex-direction: column; min-height: 120px; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .date { width: 40px; height: 40px; background: #004bb1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1 style="color:#004bb1">TOKIUM Tech Blog Calendar 2025</h1>
    <div id="calendar" class="grid">読み込み中...</div>

    <script>
        // 【修正ポイント】CORS制限を受けにくいURL形式に変更
        const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkLP2zVJ0c2sXVYrMxdjGE036A-JtpQKJEasY7LnGCYMPpVmUugnGz5xIaT8Nq3lGVy2lXHAUEEP2/pubhtml?gid=0&single=true';

        async function loadCalendar() {
            try {
                const response = await fetch(url);
                const html = await response.text();
                const container = document.getElementById('calendar');
                
                // HTMLの中に埋もれた JSONデータ { ... } を力技で探し出します
                const rows = html.match(/{.*?}/g);
                if (!rows) throw new Error("No data found");

                container.innerHTML = '';
                rows.forEach(row => {
                    try {
                        // 特殊な記号を掃除してJSONとして解析
                        const item = JSON.parse(row.replace(/&quot;/g, '"'));
                        if (!item.date) return;
                        
                        const card = document.createElement('a');
                        card.className = 'card'; card.href = item.url || '#'; card.target = '_blank';
                        card.innerHTML = `<div class="date">${new Date(item.date).getDate()}</div><div style="font-weight:bold;text-align:left;">${item.title}</div><div style="text-align:right;margin-top:10px;font-size:0.8em;color:#666;">${item.name}</div>`;
                        container.appendChild(card);
                    } catch(e) { /* 解析エラーは無視 */ }
                });
            } catch (e) {
                document.getElementById('calendar').innerHTML = "<h2>データ同期中...</h2><p>スプレッドシートを更新して5分ほどお待ちください。</p>";
            }
        }
        loadCalendar();
    </script>
</body>
</html>
