<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Advent Calendar 2026</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        header { background: #00a0e9; color: white; text-align: center; padding: 40px; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 6px solid #00a0e9; }
        .card-date { color: #00a0e9; font-weight: bold; margin-bottom: 10px; }
        .card-author { font-size: 0.9em; color: #666; margin-bottom: 10px; }
        .card-title { font-size: 1.1em; margin: 0 0 15px; line-height: 1.4; }
        .card-link { display: inline-block; background: #00a0e9; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>📅 TOKIUM Advent Calendar 2026</h1>
    </header>
    <main>
        <div id="calendar" class="calendar-grid"></div>
    </main>

    <script>
        async function fetchCalendar() {
            try {
                // GASではなく、自分のリポジトリ内の data.json を読み込む
                const response = await fetch('./data.json');
                const data = await response.json();
                
                const container = document.getElementById('calendar');
                data.sort((a, b) => new Date(a.date) - new Date(b.date));

                data.forEach(item => {
                    const d = new Date(item.date);
                    const dateStr = isNaN(d) ? "未定" : `${d.getMonth() + 1}/${d.getDate()}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-date">${dateStr}</div>
                        <div class="card-author">👤 ${item.name || 'Anonymous'}</div>
                        <h2 class="card-title">${item.title || '（タイトル未設定）'}</h2>
                        ${item.url ? `<a href="${item.url}" target="_blank" class="card-link">記事を読む</a>` : '<span style="color:#ccc">準備中</span>'}
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.body.innerHTML += '<p style="text-align:center">データの読み込みに失敗しました。data.jsonが存在するか確認してください。</p>';
            }
        }
        fetchCalendar();
    </script>
</body>
</html>
