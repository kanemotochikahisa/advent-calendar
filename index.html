<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOKIUM Tech Blog Calendar</title>

  <style>
    :root {
      --tokium-blue: #004bb1;
      --tokium-light: #e6edf7;
      --border-color: #cbd5e0;
      --text-color: #2d3748;
    }

    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 10px;
      color: var(--text-color);
      height: calc(100vh - 20px);
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 6px;
    }

    .header h1 {
      color: var(--tokium-blue);
      font-size: 1.3em;
      margin: 4px 0;
    }

    .nav-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }

    .nav-btn {
      background: var(--tokium-blue);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75em;
    }

    .month-label {
      font-weight: bold;
      min-width: 90px;
      text-align: center;
    }

    .calendar-container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      height: calc(100% - 70px);
      display: flex;
      flex-direction: column;
    }

    .weekday-header,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday-header {
      background: var(--tokium-light);
      font-size: 0.7em;
      font-weight: bold;
      text-align: center;
      padding: 4px 0;
    }

    .calendar-grid {
      flex: 1;
      gap: 2px;
      border: 1px solid var(--border-color);
      background: var(--border-color);
    }

    .day-slot {
      background: white;
      padding: 2px 4px;
      font-size: 0.65em;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .day-number {
      font-size: 0.75em;
      font-weight: bold;
      color: #a0aec0;
    }

    .card {
      margin-top: 2px;
      padding: 2px;
      border-top: 2px solid var(--tokium-blue);
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card-title {
      font-weight: bold;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-author {
      font-size: 0.85em;
      color: var(--tokium-blue);
      text-align: right;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>TOKIUM Tech Blog</h1>
    <div class="nav-controls">
      <button class="nav-btn" onclick="changeMonth(-1)">◀ PREV</button>
      <div id="month-display" class="month-label"></div>
      <button class="nav-btn" onclick="changeMonth(1)">NEXT ▶</button>
    </div>
  </div>

  <div class="calendar-container">
    <div class="weekday-header">
      <div>SUN</div><div>MON</div><div>TUE</div>
      <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>
    <div id="calendar" class="calendar-grid"></div>
  </div>

  <script>
    let currentDate = new Date();
    let posts = [];

    async function loadData() {
      // ★ここを GAS の WebアプリURL に置き換える
      const GAS_URL = "https://script.google.com/macros/s/XXXXXXXXXXXX/exec";

      const res = await fetch(GAS_URL + "?t=" + Date.now());
      posts = await res.json();
      render();
    }

    function changeMonth(diff) {
      currentDate.setMonth(currentDate.getMonth() + diff);
      render();
    }

    function render() {
      const calendar = document.getElementById("calendar");
      const label = document.getElementById("month-display");
      calendar.innerHTML = "";

      const y = currentDate.getFullYear();
      const m = currentDate.getMonth();

      label.textContent = `${y} / ${m + 1}`;

      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= lastDate; d++) {
        const slot = document.createElement("div");
        slot.className = "day-slot";
        slot.innerHTML = `<div class="day-number">${d}</div>`;

        const dateStr = `${y}/${String(m + 1).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
        const post = posts.find(p => p.date === dateStr);

        if (post) {
          const card = document.createElement("a");
          card.className = "card";
          card.href = post.url;
          card.target = "_blank";
          card.rel = "noopener";

          card.innerHTML = `
            <div class="card-title">${post.title}</div>
            <div class="card-author">${post.name || ""}</div>
          `;

          slot.appendChild(card);
        }

        calendar.appendChild(slot);
      }
    }

    loadData();
  </script>
</body>
</html>
