<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Tech Blog Monthly Calendar</title>
    <style>
        :root {
            --primary-color: #004bb1;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --empty-bg: #e0e4e8;
            --text-main: #333;
        }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        
        /* ヘッダーとナビゲーション */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary-color); margin-bottom: 15px; }
        .nav-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .nav-btn { background: var(--primary-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { opacity: 0.8; }
        .month-label { font-size: 1.4em; font-weight: bold; min-width: 150px; }

        /* カレンダーグリッド */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 日付枠の基本スタイル */
        .day-slot {
            aspect-ratio: 1 / 1;
            background: var(--empty-bg);
            border-radius: 8px;
            position: relative;
            border: 1px solid #ccc;
            overflow: hidden;
        }

        .day-number { font-size: 1.5em; font-weight: 900; color: rgba(0,0,0,0.1); position: absolute; top: 8px; left: 8px; z-index: 1; }

        /* 記事カード */
        .card {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            z-index: 2;
            text-decoration: none;
            color: inherit;
            transition: 0.2s;
        }
        /* URLがある場合のみホバー効果 */
        a.card:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 3; }
        
        /* 公開済み・未公開の区別 */
        .card.published { border-top: 5px solid var(--primary-color); cursor: pointer; }
        .card.draft { border-top: 5px solid #95a5a6; cursor: default; opacity: 0.8; background: #fafafa; }

        .card-title { font-size: 0.85em; font-weight: bold; line-height: 1.4; flex-grow: 1; margin-top: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
        .card-author { font-size: 0.7em; color: #777; text-align: right; margin-top: 5px; }
        .status-badge { font-size: 0.6em; background: #eee; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>TOKIUM Tech Blog</h1>
        <div class="nav-controls">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ 前月</button>
            <div id="month-display" class="month-label"></div>
            <button class="nav-btn" onclick="changeMonth(1)">次月 ▶</button>
        </div>
    </div>

    <div id="calendar" class="calendar-grid"></div>

    <script>
        let currentViewDate = new Date(); // 現在表示している年月
        let allPosts = [];

        async function loadData() {
            try {
                const response = await fetch('./data.json?v=' + new Date().getTime());
                allPosts = await response.json();
                renderCalendar();
            } catch (e) {
                document.getElementById('calendar').innerHTML = "データの読み込みに失敗しました。";
            }
        }

        function changeMonth(diff) {
            currentViewDate.setMonth(currentViewDate.getMonth() + diff);
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar');
            const monthDisplay = document.getElementById('month-display');
            container.innerHTML = '';

            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();

            monthDisplay.textContent = `${year}年 ${month + 1}月`;

            for (let i = 1; i <= lastDay; i++) {
                const dateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
                const dailyPosts = allPosts.filter(p => p.date === dateStr);

                const slot = document.createElement('div');
                slot.className = 'day-slot';
                slot.innerHTML = `<div class="day-number">${i}</div>`;

                dailyPosts.forEach(post => {
                    const isPublished = post.url && post.url.startsWith('http');
                    // URLがあれば <a>、なければ <div> で作成
                    const card = document.createElement(isPublished ? 'a' : 'div');
                    card.className = `card ${isPublished ? 'published' : 'draft'}`;
                    
                    if (isPublished) {
                        card.href = post.url;
                        card.target = '_blank';
                    }

                    card.innerHTML = `
                        <div class="day-number">${i}</div>
                        <div class="card-title">
                            ${!isPublished ? '<span class="status-badge">準備中</span><br>' : ''}
                            ${post.title}
                        </div>
                        <div class="card-author">${post.name || '未登録'}</div>
                    `;
                    slot.appendChild(card);
                });

                container.appendChild(slot);
            }
        }

        loadData();
    </script>
</body>
</html>
