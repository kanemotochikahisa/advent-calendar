<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TOKIUM Tech Blog</title>
<style>
body { font-family:sans-serif; background:#f3f4f6; margin:0; padding:20px; }
h1 { text-align:center; color:#004bb1; }
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.day { background:#fff; min-height:100px; padding:5px; border:1px solid #ddd; }
.num { font-size:12px; color:#888; }
.card { display:block; margin-top:5px; font-size:12px; border-top:2px solid #004bb1; text-decoration:none; color:#000; }
.name { text-align:right; font-size:11px; color:#004bb1; }
</style>
</head>
<body>

<h1>TOKIUM Tech Blog</h1>
<div id="calendar" class="calendar"></div>

<script>

// ★★★★★ Apps Script URL ★★★★★
const API_URL = "ここにGASのURLを貼る";

let posts = [];

async function load() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    posts = await res.json();
    render();
  } catch(e) {
    console.error("API取得失敗", e);
  }
}

function render() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();

  const firstDay = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    cal.appendChild(document.createElement("div"));
  }

  for(let d=1; d<=lastDate; d++){
    const cell = document.createElement("div");
    cell.className = "day";

    const dateStr =
      y + "/" +
      String(m+1).padStart(2,"0") + "/" +
      String(d).padStart(2,"0");

    cell.innerHTML = `<div class="num">${d}</div>`;

    const post = posts.find(p => p.date === dateStr);

    if(post){
      const el = document.createElement(post.url ? "a":"div");
      el.className = "card";
      if(post.url){
        el.href = post.url;
        el.target = "_blank";
      }
      el.innerHTML = `
        <div>${post.title}</div>
        <div class="name">${post.name}</div>
      `;
      cell.appendChild(el);
    }

    cal.appendChild(cell);
  }
}

load();
</script>
</body>
</html>
