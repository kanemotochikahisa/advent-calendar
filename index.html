<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Advent Calendar 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📅 Advent Calendar 2026</h1>
        <p>TOKIUMメンバーによる技術・カルチャー発信</p>
    </header>

    <main>
        <div id="loading" class="message">
            <p>データを読み込み中...</p>
            <small>※表示されない場合はTOKIUMアカウントでGoogleログインしてください</small>
        </div>
        <div class="calendar-grid" id="calendar"></div>
    </main>

    <script>
        // 先ほど発行されたGASのURL
        const GAS_URL = 'https://script.google.com/a/macros/tokium.jp/s/AKfycbxA3dZch-F0jJT0CP45UAGAkf4bHiPmChxYqHl7u18eTyiIB-v1t2dYDe0_Vr9-mnocwA/exec';

        async function fetchCalendar() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                // 日付順に並び替え
                data.sort((a, b) => new Date(a.date) - new Date(b.date));

                const container = document.getElementById('calendar');
                document.getElementById('loading').style.display = 'none';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // 以前決めた「タイトルと製作者を覚える」ための表示
                    card.innerHTML = `
                        <div class="card-date">${item.date}</div>
                        <div class="card-author">👤 ${item.name || 'Anonymous'}</div>
                        <h2 class="card-title">${item.title || 'Coming Soon...'}</h2>
                        ${item.url ? `<a href="${item.url}" target="_blank" class="card-link">記事を読む</a>` : '<span class="pending">準備中</span>'}
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <p class="error">❌ データの取得に失敗しました</p>
                    <p><a href="${GAS_URL}" target="_blank">こちら</a>を別タブで開き、Googleログイン後に再読み込みしてください。</p>
                `;
            }
        }

        fetchCalendar();
    </script>
</body>
</html>
