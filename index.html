<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Advent Calendar 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📅 TOKIUM Advent Calendar 2026</h1>
        <p>タイトルと製作者を記録するアドベントカレンダー</p>
    </header>

    <main>
        <div id="loading" class="message">データを読み込み中...</div>
        <div class="calendar-grid" id="calendar"></div>
    </main>

    <script>
        const GAS_URL = 'https://script.google.com/a/macros/tokium.jp/s/AKfycbxA3dZch-F0jJT0CP45UAGAkf4bHiPmChxYqHl7u18eTyiIB-v1t2dYDe0_Vr9-mnocwA/exec';

        async function fetchCalendar() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                const container = document.getElementById('calendar');
                document.getElementById('loading').style.display = 'none';

                if (!data || data.length === 0) {
                    document.getElementById('loading').innerHTML = '表示できるデータがありません。';
                    return;
                }

                // 元データの項目名に合わせて表示
                data.forEach(item => {
                    // 日付の整形（2026-02-16T... 形式を M/D に）
                    let displayDate = "未定";
                    if (item.date) {
                        const d = new Date(item.date);
                        displayDate = `${d.getMonth() + 1}/${d.getDate()}`;
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-date">${displayDate}</div>
                        <div class="card-author">👤 ${item.name || '未登録'}</div>
                        <h2 class="card-title">${item.title || 'タイトル未設定'}</h2>
                        ${item.url ? 
                            `<a href="${item.url}" target="_blank" class="card-link">記事を読む</a>` : 
                            '<span class="pending">執筆中...</span>'}
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = '❌ データの取得に失敗しました。<br>TOKIUMアカウントでGoogleにログインしているか確認してください。';
            }
        }

        fetchCalendar();
    </script>
</body>
</html>
