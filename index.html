<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKIUM Advent Calendar 2026</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; }
        header { background: linear-gradient(135deg, #00a0e9, #0076ad); color: white; text-align: center; padding: 60px 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; padding: 0 20px 60px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 8px solid #00a0e9; display: flex; flex-direction: column; }
        .card-date { font-weight: bold; color: #00a0e9; font-size: 1.2em; margin-bottom: 5px; }
        .card-author { font-size: 0.9em; color: #777; margin-bottom: 15px; }
        .card-title { font-size: 1.1em; margin: 0 0 20px; line-height: 1.5; flex-grow: 1; }
        .card-link { display: block; text-align: center; background: #00a0e9; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; }
        .pending { text-align: center; color: #ccc; font-style: italic; padding: 12px; }
        .message { text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>📅 TOKIUM Advent Calendar 2026</h1>
        <p>タイトルと製作者を記録するアドベントカレンダー</p>
    </header>

    <main>
        <div id="loading" class="message">データを読み込み中...</div>
        <div id="calendar" class="calendar-grid"></div>
    </main>

    <script>
        async function fetchCalendar() {
            try {
                // リポジトリ内の data.json を読み込みます
                const response = await fetch('./data.json');
                const data = await response.json();
                
                const container = document.getElementById('calendar');
                document.getElementById('loading').style.display = 'none';

                // 日付順にソート（日付がないものは後ろへ）
                data.sort((a, b) => {
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    return new Date(a.date) - new Date(b.date);
                });

                data.forEach(item => {
                    let displayDate = "未定";
                    if (item.date) {
                        const d = new Date(item.date);
                        if (!isNaN(d.getTime())) {
                            displayDate = `${d.getMonth() + 1}/${d.getDate()}`;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-date">${displayDate}</div>
                        <div class="card-author">👤 ${item.name || 'Anonymous'}</div>
                        <h2 class="card-title">${item.title || '（タイトル未設定）'}</h2>
                        ${item.url ? 
                            `<a href="${item.url}" target="_blank" class="card-link">記事を読む</a>` : 
                            '<span class="pending">執筆中...</span>'}
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML = '❌ データの読み込みに失敗しました。';
            }
        }
        fetchCalendar();
    </script>
</body>
</html>
