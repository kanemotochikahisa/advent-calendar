<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TOKIUM Tech Blog Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>TOKIUM Tech Blog Calendar</h1>
<p class="subtitle">技術記事の公開スケジュール</p>

<div class="nav">
  <button id="prev">◀</button>
  <span id="month"></span>
  <button id="next">▶</button>
</div>

<div class="calendar-header">
  <div class="sun">SUN</div>
  <div>MON</div>
  <div>TUE</div>
  <div>WED</div>
  <div>THU</div>
  <div>FRI</div>
  <div class="sat">SAT</div>
</div>

<div id="calendar" class="calendar"></div>

<script src="script.js"></script>
</body>
</html>
