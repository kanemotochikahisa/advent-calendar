<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOKIUM Tech Blog Calendar</title>
    <script src="./data.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-decoration: none; color: #333; border-top: 6px solid #004bb1; display: block; transition: 0.3s; text-align: left; }
        .card:hover { transform: translateY(-5px); }
        .date { font-weight: bold; color: #004bb1; font-size: 1.2em; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1 style="color:#004bb1;">TOKIUM Tech Blog Calendar</h1>
    <div id="calendar" class="grid"></div>
    <script>
        const container = document.getElementById('calendar');
        if (typeof calendarData !== 'undefined' && calendarData.length > 0) {
            calendarData.filter(d => d.date).sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(item => {
                const day = new Date(item.date).getDate();
                const card = document.createElement('a');
                card.className = 'card'; card.href = item.url || '#'; card.target = '_blank';
                card.innerHTML = `<div class="date">${day}日</div><div><b>${item.title}</b></div><div style="text-align:right; font-size:0.8em; color:#666; margin-top:10px;">${item.name}</div>`;
                container.appendChild(card);
            });
        } else {
            container.innerHTML = "<h2>データ読み込み中...</h2><p>Actionsを実行してください。</p>";
        }
    </script>
</body>
</html>
